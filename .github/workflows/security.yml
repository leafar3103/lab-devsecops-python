name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  issues: write
  id-token: write

jobs:
  check-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-groups

      # 1. SAST - Bandit (Gera HTML para o Dashboard)
      - name: Run Bandit (SAST)
        run: |
          mkdir -p public
          uv run bandit -r src/ -f html -o public/index.html || true

      # 2. SBOM - Trivy (Gera JSON para o Pandas/Streamlit)
      - name: Generate SBOM (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'public/sbom.json'

      # 3. Verificação de Vulnerabilidades Críticas (SCA)
      # Adicionamos continue-on-error para o pipeline não "morrer" antes de salvar os dados
      - name: Scan for Critical Vulnerabilities
        id: trivy_scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # 4. Criação de Issue (Só roda se o scan acima falhar)
      - name: Create Issue on Vulnerability Discovery
        if: steps.trivy_scan.outcome == 'failure'
        run: |
          gh issue create --title "Vulnerabilidades Críticas detectadas: $(date +'%d/%m/%Y')" \
                          --body "O scan do Trivy detectou falhas críticas nas dependências. Verifique o arquivo sbom.json nos artefatos."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Prepara os arquivos para o Pages (Sempre roda)
      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      # 6. Salva o SBOM para o seu Dashboard Pandas (Sempre roda)
      - name: Upload Data for Analytics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: public/
