name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Bandit (SAST)
        # O Bandit vai ler o pyproject.toml para saber o que ignorar
        run: uv run bandit -r src/

      - name: Run Safety (SCA)
        # Verifica se o Flask ou outras libs têm CVEs
        run: uv run safety check
