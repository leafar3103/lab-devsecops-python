name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  issues: write    # Necessário para criar Issues
  id-token: write

jobs:
  check-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Bandit (Generate HTML Report)
        # O || true evita que o pipeline pare aqui, permitindo gerar os outros reports
        run: |
          mkdir -p public
          uv run bandit -r src/ -f html -o public/index.html || true

      - name: Generate SBOM (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'public/sbom.json'

      # Cria Issue se o Bandit encontrou algo (baseado no exit code do Bandit sem o || true)
      - name: Check for Bandit Failures and Create Issue
        if: github.ref == 'refs/heads/main'
        run: |
          if uv run bandit -r src/; then
            echo "Nenhuma vulnerabilidade encontrada."
          else
            gh issue create --title "Falha de Segurança Detectada" --body "O Bandit encontrou vulnerabilidades. Verifique o dashboard no GitHub Pages."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Upload Security Data (Para Pandas/Streamlit)
        uses: actions/upload-artifact@v4
        with:
          name: security-data
          path: public/

  deploy-report:
    needs: check-security
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
