name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  issues: write
  id-token: write

jobs:
  check-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-groups

      # 1. SAST - Bandit (Gera HTML para o Dashboard)
      - name: Run Bandit (SAST)
        run: |
          mkdir -p public
          uv run bandit -r src/ -f html -o public/index.html || true

      # 2. SBOM - Trivy (Gera JSON para o Pandas/Streamlit)
      - name: Generate SBOM (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'public/sbom.json'

      # 3. Verificação de Vulnerabilidades Críticas (SCA)
      # Se houver falhas críticas, este passo falha e dispara a criação da Issue abaixo
      - name: Scan for Critical Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # 4. Criação de Issue automática em caso de falha
      - name: Create Issue on Vulnerability Discovery
        if: failure()
        run: |
          gh issue create --title "Vulnerabilidades Críticas detectadas no SBOM" \
                          --body "O scan do Trivy detectou falhas de segurança nas dependências. Verifique o arquivo sbom.json no dashboard."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Prepara os arquivos para o GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      # 6. Salva o SBOM como artefato para você baixar e usar no Streamlit/Pandas local
      - name: Upload Data for Analytics
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: public/

  deploy-report:
    needs: check-security
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
